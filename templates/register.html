{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card card-glass p-4 shadow">
            <h3 class="text-center text-info mb-3">Registro de Usuario</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Nombre de Usuario</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Rol del Sistema</label>
                    <select name="rol" class="form-select">
                        <option value="analista">Analista Agrícola (Crear y Editar)</option>
                        <option value="administrador">Administrador (Control Total + Eliminar)</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold">Crear Cuenta</button>
            </form>
            <hr>
            <p class="text-center mb-0"><a href="{{ url_for('login') }}" class="text-info">Volver al inicio de sesión</a></p>
        </div>
    </div>
</div>
{% endblock %}
