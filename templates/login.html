{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card card-glass p-4 shadow">
            <h3 class="text-center text-info mb-3">Iniciar Sesión</h3>
            <p class="text-center text-secondary small">Plataforma de Redirección Agrícola - NASA Space Apps 2026</p>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text" name="username" class="form-control" required placeholder="Ej. admin">
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-control" required placeholder="Ej. admin123">
                </div>
                <button type="submit" class="btn btn-info w-100 fw-bold">Ingresar</button>
            </form>
            <hr>
            <p class="text-center mb-0">¿No tienes cuenta? <a href="{{ url_for('register') }}" class="text-info">Regístrate aquí</a></p>
            <p class="text-center text-muted small mt-2">Admin por defecto: <b>admin</b> / <b>admin123</b></p>
        </div>
    </div>
</div>
{% endblock %}
