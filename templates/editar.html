{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card card-glass p-4">
            <h4 class="text-info mb-3">✏️ Actualizar Evaluación #{{ registro.id }}</h4>
            <p><b>Origen:</b> {{ registro.zona_origen }}<br><b>Destino:</b> {{ registro.zona_destino }}</p>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Estado de la Alerta</label>
                    <select name="estado_alerta" class="form-select">
                        <option value="REDIRECCIÓN INTELIGENTE ACTIVADA" {% if registro.estado_alerta == 'REDIRECCIÓN INTELIGENTE ACTIVADA' %}selected{% endif %}>REDIRECCIÓN INTELIGENTE ACTIVADA</option>
                        <option value="ALERTA VITAL DE SEGURIDAD ALIMENTARIA" {% if registro.estado_alerta == 'ALERTA VITAL DE SEGURIDAD ALIMENTARIA' %}selected{% endif %}>ALERTA VITAL DE SEGURIDAD ALIMENTARIA</option>
                        <option value="PLAN EJECUTADO / CONTROLADO" {% if registro.estado_alerta == 'PLAN EJECUTADO / CONTROLADO' %}selected{% endif %}>PLAN EJECUTADO / CONTROLADO</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Notas / Plan de Acción Agrícola</label>
                    <textarea name="notas_accion" class="form-control" rows="3" required>{{ registro.notas_accion }}</textarea>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-warning fw-bold">Guardar Cambios</button>
                    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
